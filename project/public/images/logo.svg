<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="300" height="320" role="img" aria-label="Gracious Schools crest">
  <!-- Background shield: crimson with charcoal outline -->
  <path d="M150,30 L235,65 C235,175 150,245 150,245 C150,245 65,175 65,65 L150,30 Z" fill="#991B1B" stroke="#1E293B" stroke-width="8"/>
  <!-- Inner white trim -->
  <path d="M150,42 L223,72 C223,168 150,230 150,230 C150,230 77,168 77,72 L150,42 Z" fill="#991B1B" stroke="#F8FAFC" stroke-width="3"/>

  <!-- Open book -->
  <path d="M110,95 Q150,80 150,100 Q150,80 190,95 L190,125 Q150,110 150,128 Q150,110 110,125 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
  <line x1="150" y1="100" x2="150" y2="128" stroke="#1E293B" stroke-width="2"/>
  <line x1="120" y1="107" x2="142" y2="102" stroke="#64748B" stroke-width="1.5"/>
  <line x1="120" y1="115" x2="142" y2="110" stroke="#64748B" stroke-width="1.5"/>
  <line x1="158" y1="102" x2="180" y2="107" stroke="#64748B" stroke-width="1.5"/>
  <line x1="158" y1="110" x2="180" y2="115" stroke="#64748B" stroke-width="1.5"/>

  <!-- Center oval: rising sun + graduation cap -->
  <ellipse cx="150" cy="165" rx="38" ry="44" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>

  <!-- Rising sun over hills -->
  <path d="M122,185 Q150,150 178,185 Z" fill="#D4A017"/>
  <line x1="150" y1="185" x2="150" y2="152" stroke="#D4A017" stroke-width="2.5"/>
  <line x1="132" y1="185" x2="138" y2="160" stroke="#D4A017" stroke-width="2"/>
  <line x1="168" y1="185" x2="162" y2="160" stroke="#D4A017" stroke-width="2"/>
  <path d="M118,188 Q150,175 182,188 Q150,200 118,188 Z" fill="#1E293B"/>

  <!-- Graduation cap on top of sun -->
  <polygon points="150,132 176,142 150,152 124,142" fill="#1E293B"/>
  <rect x="142" y="151" width="16" height="9" rx="1" fill="#1E293B"/>
  <path d="M170,144 L173,158" stroke="#D4A017" stroke-width="2"/>
  <circle cx="173" cy="159" r="2" fill="#D4A017"/>

  <!-- Top ribbon: GRACIOUS -->
  <path d="M45,60 Q150,25 255,60 L242,88 Q150,55 58,88 Z" fill="#1E293B" stroke="#FFFFFF" stroke-width="2"/>
  <text x="150" y="72" fill="#FFFFFF" font-family="Georgia, serif" font-weight="900" font-size="20" text-anchor="middle">GRACIOUS</text>

  <!-- Bottom ribbon: SCHOOLS -->
  <path d="M45,245 Q150,280 255,245 L242,217 Q150,250 58,217 Z" fill="#1E293B" stroke="#FFFFFF" stroke-width="2"/>
  <text x="150" y="240" fill="#FFFFFF" font-family="Georgia, serif" font-weight="900" font-size="20" text-anchor="middle">SCHOOLS</text>

  <!-- Laurel leaves -->
  <path d="M60,115 C45,150 55,195 85,220" fill="none" stroke="#64748B" stroke-width="10" stroke-linecap="round"/>
  <path d="M240,115 C255,150 245,195 215,220" fill="none" stroke="#64748B" stroke-width="10" stroke-linecap="round"/>

  <!-- Crossed pencils -->
  <line x1="50" y1="265" x2="250" y2="50" stroke="#991B1B" stroke-width="12" stroke-linecap="round"/>
  <line x1="50" y1="265" x2="250" y2="50" stroke="#D4A017" stroke-width="7" stroke-linecap="round"/>
  <line x1="250" y1="265" x2="50" y2="50" stroke="#991B1B" stroke-width="12" stroke-linecap="round"/>
  <line x1="250" y1="265" x2="50" y2="50" stroke="#D4A017" stroke-width="7" stroke-linecap="round"/>
</svg>
